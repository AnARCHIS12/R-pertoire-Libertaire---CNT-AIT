<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="#18181c" stroke="#dc2626" stroke-width="4"/>
  
  <!-- Outer circle for the "A in circle" symbol -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#dc2626" stroke-width="8"/>
  
  <!-- The "A" letter -->
  <g fill="#dc2626" stroke="none">
    <!-- Left leg of A -->
    <path d="M 65 145 L 85 65 L 95 65 L 75 145 Z"/>
    
    <!-- Right leg of A -->
    <path d="M 105 65 L 115 65 L 135 145 L 125 145 Z"/>
    
    <!-- Horizontal bar of A -->
    <rect x="75" y="100" width="50" height="10" rx="2"/>
    
    <!-- Top of A (triangle) -->
    <path d="M 100 50 L 85 65 L 115 65 Z"/>
  </g>
</svg>
